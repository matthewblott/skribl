<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col">
  <!-- Header with Navigation and Action Buttons -->
  <header class="bg-white border-b border-gray-200 shadow-sm">
    <nav class="flex items-center justify-between px-4 py-3">
      <!-- Left side - Back button -->
      <a href="/notes" class="inline-flex items-center text-gray-700">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
        </svg>
        <span class="font-medium">Notes</span>
      </a>
      
      <!-- Right side - Action buttons -->
      <menu class="flex space-x-2">
        <!-- Clear Button -->
        <li>
          <button type="button" id="clear-button" class="inline-flex items-center px-3 py-1 border border-gray-300 rounded-md text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
            </svg>
            Clear
          </button>
        </li>
        
        <!-- Save Button -->
        <li>
          <button type="submit" form="note-form" class="inline-flex items-center px-3 py-1 border border-transparent rounded-md text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
            </svg>
            Save
          </button>
        </li>
      </menu>
    </nav>
  </header>

  <!-- Main Note Canvas Area (largest part of screen) -->
  <main class="flex-1 overflow-hidden flex flex-col">
    <form id="note-form" class="flex-1 flex flex-col">
      <!-- Drawing Canvas for Stylus/Finger Input -->
      <canvas 
        id="drawing-canvas" 
        class="flex-1 w-full h-full bg-white touch-none"
      ></canvas>
    </form>
  </main>
</body>
</html>
